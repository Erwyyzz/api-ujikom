services:
  app:
    build: .
    container_name: api_ujikom_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "8001:80"
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: api_ujikom_db
    restart: always
    environment:
      MYSQL_DATABASE: api_ujikom_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: api_ujikom_pma
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - db

volumes:
  dbdata:
